name: iOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and test
        run: |
          set -euo pipefail

          IOS_RUNTIME_ID="$(
            xcrun simctl list runtimes available --json |
              jq -r '
                [
                  .runtimes[]
                  | select(
                      .isAvailable == true
                      and (.identifier | contains("SimRuntime.iOS"))
                    )
                ]
                | sort_by(.version | split(".") | map(tonumber))
                | last
                | .identifier // empty
              '
          )"

          IPHONE_UDID="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$IOS_RUNTIME_ID" '
                [
                  .devices[$runtime][]?
                  | select(
                      .isAvailable == true
                      and (.name | startswith("iPhone"))
                    )
                ]
                | first
                | .udid // empty
              '
          )"

          if [[ -z "$IOS_RUNTIME_ID" || -z "$IPHONE_UDID" ]]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list runtimes available
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild \
            -project HappyHour.xcodeproj \
            -scheme HappyHour \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project HappyHour.xcodeproj \
            -scheme HappyHour \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:HappyHourTests \
            test

          xcodebuild \
            -project HappyHour.xcodeproj \
            -scheme HappyHour \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:HappyHourUITests \
            test
